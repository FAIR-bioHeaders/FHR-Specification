id: https://w3id.org/fhr/core
name: FAIRBioHeadersCore
description: >-
  Shared core for the FAIR-bioHeaders family (FHR, FHT, FHP, FHGFF3). Header-type
  schemas import this module, list the core slots on their root class, and add
  their own subject slot and type-specific slots. Slot names, types, patterns and
  constraints match FHR schemaVersion 1 as tightened for v0.4
  (docs/SCHEMA-CHANGES-v0.4.md). The id is provisional pending the
  persistent schema URL decision (specs/004-shared-core-schema FR-004).
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
- linkml:types
types:
  sha2:
    base: str
    pattern: ^[A-Za-z0-9+/]{43}=$
    description: >-
      Base64 SHA-512/256 digest: standard padded base64 of 32 bytes (43 base64
      characters, then one "="), as defined for FHR checksums. A syntactic check
      only; it does not verify the file.
slots:
  # Required core slots (FR-001).
  schema:
    description: Centralized schema file
    required: true
  schemaVersion:
    description: Version of the header schema; restricted to 1
    range: float
    equals_number: 1
    required: true
  taxon:
    description: Species name and URL of the species information at identifiers.org
    range: Taxon
    inlined: true
    required: true
  version:
    description: Version number of the described data
    required: true
  metadataAuthor:
    description: Authors of the header instance
    range: Author
    multivalued: true
    inlined_as_list: true
    required: true
  dateCreated:
    description: Date the described data was created
    range: date
    required: true
  checksum:
    description: sha2-512/256 checksum value for hashing
    range: sha2
    required: true
  # Optional core slots (FR-001).
  identifier:
    description: Identifiers of the described data
    multivalued: true
    pattern: ^[A-Za-z0-9._-]+:.+$
  accessionID:
    description: Accession of the described data
    range: AccessionID
    inlined: true
  scholarlyArticle:
    description: DOI (without a resolver prefix) of the scholarly article where the data was published
    pattern: ^10\.[0-9]+(\.[0-9]+)*/\S+$
  documentation:
    description: Documentation about the described data
  relatedLink:
    description: Related URLs
    range: uri
    multivalued: true
  funding:
    description: Grant line item
  reuseConditions:
    description: Reuse conditions or license
  voucherSpecimen:
    description: Description of the physical sample
  # Shared definitions used by header types and by DerivedFrom.
  # Defined in the core so DerivedFrom can reuse it; header types opt in by listing it.
  seqcol_id:
    description: Unprefixed refget sequence collection top-level digest (sha512t24u).
    range: string
    pattern: ^[A-Za-z0-9_-]{32}$
  derivedFrom:
    description: >-
      Parent files this file was derived from, identified by their FHR-family
      checksum. Header types opt in by listing this slot; FHR schemaVersion 1
      does not include it.
    range: DerivedFrom
    multivalued: true
    inlined_as_list: true
  headerType:
    description: FAIR-bioHeaders type of the parent file
    range: HeaderType
  relationship:
    description: >-
      How this file relates to the parent. Provisional vocabulary: a PROV-O or
      Relation Ontology mapping is pending a maintainer decision
      (FHR-Specification#54).
    range: DerivationRelationship
classes:
  Taxon:
    description: Species name and taxonomy URI
    attributes:
      name:
        description: Name of the species
      uri:
        description: Taxonomy URI
        range: uri
        pattern: ^https://identifiers\.org/taxonomy:[0-9]+$
  Author:
    description: Person or organization; uri is an ORCID URI
    attributes:
      name:
        description: Name of the person or organization
      uri:
        description: ORCID URI
        range: uri
        pattern: ^https://orcid\.org/[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$
  AccessionID:
    description: Accession identifier
    attributes:
      name:
        description: Accession name
      url:
        description: Accession URL
        range: uri
  DerivedFrom:
    description: >-
      Link to a parent file by its FHR-family checksum (specs/004-shared-core-schema
      FR-003). Provisional until the relationship vocabulary is decided
      (FHR-Specification#54).
    slots:
    - headerType
    - checksum
    - seqcol_id
    - accessionID
    - relationship
    slot_usage:
      headerType:
        required: true
      checksum:
        description: FHR-family checksum of the parent file
      seqcol_id:
        description: Sequence collection digest of the parent, if supplied
      accessionID:
        description: Accession of the parent file
      relationship:
        required: true
enums:
  HeaderType:
    description: FAIR-bioHeaders header types
    permissible_values:
      FHR:
        description: FAIR Header Reference genome
      FHT:
        description: FAIR Header Transcriptome
      FHP:
        description: FAIR Header Proteome
      FHGFF3:
        description: FAIR Header for GFF3 annotation
  DerivationRelationship:
    description: >-
      Provisional relationship vocabulary for derivedFrom. Values and any PROV-O /
      Relation Ontology mapping await a maintainer decision (FHR-Specification#54).
    permissible_values:
      annotates:
        description: This file annotates the parent (e.g. GFF3 on a genome).
      transcribedFrom:
        description: This file's sequences are transcribed from the parent.
      translatedFrom:
        description: This file's sequences are translated from the parent.
      filteredFrom:
        description: This file is a subset or filtered copy of the parent.
      assembledFrom:
        description: This file was assembled from the parent.
