<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="942" viewBox="0 0 1200 942">
<title>FHR metadata field overview</title>
<desc>Required and optional fields in the FHR v0.3 schema. See fhr.json for full validation constraints.</desc>
<rect width="1200" height="100%" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="40" y="50" font-size="28">FHR v0.3 metadata — schemaVersion 1</text>
<text x="40" y="85" font-size="17">JSON/YAML · FASTA ;~ · GFA #~ · HTML microdata</text>
<text x="40" y="130" font-size="22" font-weight="bold">Required</text>
<text x="40" y="170" font-size="18">schema: string</text>
<text x="40" y="208" font-size="18">schemaVersion: number</text>
<text x="40" y="246" font-size="18">genome: string</text>
<text x="40" y="284" font-size="18">taxon: object</text>
<text x="40" y="322" font-size="18">version: string</text>
<text x="40" y="360" font-size="18">metadataAuthor: array</text>
<text x="40" y="398" font-size="18">assemblyAuthor: array</text>
<text x="40" y="436" font-size="18">dateCreated: string</text>
<text x="40" y="474" font-size="18">masking: string</text>
<text x="40" y="512" font-size="18">checksum: string</text>
<text x="620" y="130" font-size="22" font-weight="bold">Optional</text>
<text x="620" y="170" font-size="18">genomeSynonym: array</text>
<text x="620" y="208" font-size="18">voucherSpecimen: string</text>
<text x="620" y="246" font-size="18">accessionID: object</text>
<text x="620" y="284" font-size="18">instrument: array</text>
<text x="620" y="322" font-size="18">scholarlyArticle: string</text>
<text x="620" y="360" font-size="18">documentation: string</text>
<text x="620" y="398" font-size="18">identifier: array</text>
<text x="620" y="436" font-size="18">relatedLink: array</text>
<text x="620" y="474" font-size="18">funding: string</text>
<text x="620" y="512" font-size="18">reuseConditions: string</text>
<text x="620" y="550" font-size="18">vitalStats: object</text>
<text x="620" y="588" font-size="18">assemblySoftware: string or object array</text>
<text x="620" y="626" font-size="18">assemblyProtocol: string</text>
<text x="620" y="664" font-size="18">seqcol_id: string</text>
<text x="40" y="757" font-size="15">assemblySoftware objects: name (required), uri, version, commandLineOption[]</text>
<text x="40" y="787" font-size="15">vitalStats: contig N50, L50, N90, L90; scaffoldN50, scaffoldL50, scaffoldN90, scaffoldL90; totalBasePairs,</text>
<text x="40" y="817" font-size="15">numberContigs, numberScaffolds, gcContent, readTechnology · nested objects reject unknown keys</text>
<text x="40" y="847" font-size="15">N50/N90: base pairs · gcContent: 0–100 percent · seqcol_id: supplied 32-character base64url digest</text>
<text x="40" y="877" font-size="15">checksum: exact-byte SHA-512/256 including metadata and sequence, except its checksum line</text>
<text x="40" y="907" font-size="15">This overview is generated from fhr.json; the JSON Schema defines the full contract.</text>
</g>
</svg>
