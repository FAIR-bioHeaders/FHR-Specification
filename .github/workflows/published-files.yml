name: Published files

# Existing FHR files cite raw-main URLs in this repository. Main's published
# copies (fhr.json, fhp.json, fhgff3.json, jsonld/, examples/ and the other
# files classified in docs/DEVELOPMENT-TREE.md) must stay byte-identical to the
# FAIR-bioHeaders-Specification release this repository is pinned to
# (SHARED_TAG in scripts/check_development_tree.py; FAIR-bioHeaders-Specification#108).
# Released bytes are compared at their tag, never at shared main, because both
# sides of a main comparison move (FAIR-bioHeaders-Specification#241, #246).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare every published file with the pinned shared release
        run: python3 scripts/check_development_tree.py --remote
      - name: Report where shared main has moved past the pinned release (advisory)
        # Shared main may change published files between releases (for example
        # jsonld/terms.* after v0.6.0). That is expected, so this step never fails
        # the job; the differences it lists are synchronized with the next release.
        run: |
          if ! python3 scripts/check_development_tree.py --remote --ref main; then
            echo "::notice::shared main differs from the pinned release for the files above; synchronize them when the next shared release is pinned"
          fi
