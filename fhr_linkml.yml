id: fhr_linkml
name: FHRLinkMLMapping
description: A schema to map FHR to NCBI, RefSeq, and JGI metadata formats.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types

types:
  sha2:
    base: str
    pattern: "^[A-Za-z0-9/+=]{44}$"

classes:
  FHR:
    description: File Header Specification for reference genomes and transcriptomes.
    tree_root: true
    attributes:
      schema:
        description: Centralized schema file
        required: true
      schemaVersion:
        description: Version of FHR
        range: float
        required: true
      genome:
        description: Name of the genome
        required: true
      genomeSynonym:
        description: Other common names of the genome
        multivalued: true
      taxon:
        description: Species name and URL of the species information at identifiers.org
        range: Taxon
        inlined: true
        required: true
      version:
        description: Version number of the genome
        required: true
      metadataAuthor:
        description: Authors of the FHR instance
        range: Author
        multivalued: true
        inlined_as_list: true
        required: true
      assemblyAuthor:
        description: Assemblers of the genome
        range: Author
        multivalued: true
        inlined_as_list: true
        required: true
      dateCreated:
        description: Date the genome assembly was created
        range: date
        required: true
      voucherSpecimen:
        description: Description of the physical sample
      accessionID:
        description: Genome assembly accession
        range: AccessionID
        inlined: true
      instrument:
        description: Physical tools and instruments used in the creation of the genome assembly
        multivalued: true
      scholarlyArticle:
        description: Scholarly article where the genome was published
        pattern: "^10."
      documentation:
        description: Documentation about the genome
      identifier:
        description: Identifiers of the genome
        multivalued: true
        pattern: "[a-z0-9]*:.*"
      relatedLink:
        description: Related URLs to the genome
        range: uri
        multivalued: true
      funding:
        description: Grant line item
      license:
        description: License for the use of the genome
      masking:
        description: Masking applied to the genome assembly
        pattern: "(not-masked|hard-masked|soft-masked|repeat-masked|unknown)"
        required: true
      vitalStats:
        description: General statistics about the genome assembly
        range: VitalStats
        inlined: true
      checksum:
        description: sha2-512/256 checksum value for hashing
        range: sha2
        required: true

  Metadata:
    description: Metadata information mapped to different resources
    attributes:
      ncbi:
        description: NCBI-specific metadata
        range: NCBIMetadata
      refseq:
        description: RefSeq-specific metadata
        range: RefSeqMetadata
      jgi:
        description: JGI-specific metadata
        range: JGIMetadata

  NCBIMetadata:
    description: Metadata fields specific to NCBI
    attributes:
      submission_id:
        description: Submission ID at NCBI
      project_id:
        description: NCBI Project ID
      biosample_id:
        description: Biosample ID at NCBI
      organism_name:
        description: Name of the organism
      taxonomy_id:
        description: Taxonomy ID
      assembly_name:
        description: Assembly name
      assembly_accession:
        description: Assembly accession number
      annotation_release:
        description: Annotation release version

  RefSeqMetadata:
    description: Metadata fields specific to RefSeq
    attributes:
      project_id:
        description: RefSeq Project ID
      biosample_id:
        description: RefSeq Biosample ID
      organism_name:
        description: Name of the organism
      taxonomy_id:
        description: Taxonomy ID
      assembly_name:
        description: Assembly name
      assembly_accession:
        description: Assembly accession number
      annotation_release:
        description: Annotation release version

  JGIMetadata:
    description: Metadata fields specific to JGI
    attributes:
      gold_id:
        description: GOLD Analysis Project ID
      biosample_id:
        description: JGI Biosample ID
      organism_name:
        description: Name of the organism
      ecosystem:
        description: Ecosystem classification (e.g., environmental, host-associated)
      sequencing_project:
        description: Sequencing project details
      analysis_project:
        description: Analysis project details
      img_submission_id:
        description: IMG submission ID
      genome_assembly_method:
        description: Genome assembly method
      genome_annotation_method:
        description: Genome annotation method
      pi_name:
        description: Principal Investigator name

  Taxon:
    description: Species name and taxonomy URI
    attributes:
      name:
        description: Name of the species
      uri:
        description: Taxonomy URI
        range: uri
        pattern: "https://identifiers.org/taxonomy:[0-9]+"

  Author:
    description: Person or organization that authored or assembled the genome
    attributes:
      name:
        description: Name of the person or organization
      uri:
        description: ORCID URI
        range: uri
        pattern: "^https://orcid.org/[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9X]"

  AccessionID:
    description: Genome assembly accession identifier
    attributes:
      name:
        description: Accession name
      url:
        description: Accession URL
        range: uri

  VitalStats:
    description: General statistics about the genome assembly
    attributes:
      L50:
        description: L50 of the genome assembly
        range: integer
      N50:
        description: N50 of the genome assembly
        range: integer
      L90:
        description: L90 of the genome assembly
        range: integer
      totalBasePairs:
        description: Total base pairs of the genome assembly
        range: integer
      numberContigs:
        description: Number of contigs of the genome assembly
        range: integer
      numberScaffolds:
        description: Number of scaffolds of the genome assembly
        range: integer
      readTechnology:
        description: Read technology of the genome assembly
