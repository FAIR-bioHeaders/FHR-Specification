id: https://w3id.org/fhr
name: FHRLinkMLMapping
description: >-
  FHR metadata and partial MIxS/MIGS crosswalks. The FHR class imports the
  FAIR-bioHeaders shared core (schemas/core.yaml) and adds FHR-only slots.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
  MIXS: https://w3id.org/mixs/
default_prefix: ex
default_range: string
imports:
- linkml:types
- schemas/core
slots:
  genome:
    description: Name of the genome
    required: true
  genomeSynonym:
    description: Other common names of the genome
    multivalued: true
  assemblyAuthor:
    description: Assemblers of the genome
    range: Author
    multivalued: true
    inlined_as_list: true
    required: true
  instrument:
    description: Physical tools and instruments used in the creation of the genome
      assembly
    multivalued: true
  masking:
    description: Masking applied to the genome assembly
    pattern: (not-masked|hard-masked|soft-masked|repeat-masked|unknown)
    required: true
  vitalStats:
    description: General statistics about the genome assembly
    range: VitalStats
    inlined: true
  assemblyProtocol:
    broad_mappings:
    - MIXS:0000090
    range: uri
    description: Assembly protocol or workflow reference URI.
  assemblySoftware:
    related_mappings:
    - MIXS:0000058
    description: Assembly software provenance or a legacy name.
    any_of:
    - range: string
    - range: AssemblySoftware
      multivalued: true
      inlined_as_list: true
classes:
  FHR:
    description: Metadata for reference genome assemblies.
    tree_root: true
    # Order follows the published fhr.json. derivedFrom is deliberately not
    # listed: FHR schemaVersion 1 does not include it.
    slots:
    - schema
    - schemaVersion
    - genome
    - genomeSynonym
    - taxon
    - version
    - metadataAuthor
    - assemblyAuthor
    - dateCreated
    - voucherSpecimen
    - accessionID
    - instrument
    - scholarlyArticle
    - documentation
    - identifier
    - relatedLink
    - funding
    - masking
    - vitalStats
    - checksum
    - reuseConditions
    - assemblyProtocol
    - seqcol_id
    - assemblySoftware
    slot_usage:
      schemaVersion:
        description: Version of FHR
      version:
        description: Version number of the genome
      metadataAuthor:
        description: Authors of the FHR instance
      dateCreated:
        description: Date the genome assembly was created
      accessionID:
        description: Genome assembly accession
      scholarlyArticle:
        description: Scholarly article where the genome was published
      documentation:
        description: Documentation about the genome
      identifier:
        description: Identifiers of the genome
      relatedLink:
        description: Related URLs to the genome
      reuseConditions:
        description: Reuse conditions or license for the genome
  VitalStats:
    description: General statistics about the genome assembly
    attributes:
      L50:
        description: L50 of the genome assembly
        range: integer
      N50:
        description: N50 of the genome assembly
        range: integer
      L90:
        description: L90 of the genome assembly
        range: integer
      totalBasePairs:
        description: Total base pairs of the genome assembly
        range: integer
      numberContigs:
        exact_mappings:
        - MIXS:0000060
        description: Number of contigs of the genome assembly
        range: integer
      numberScaffolds:
        description: Number of scaffolds of the genome assembly
        range: integer
      readTechnology:
        description: Read technology of the genome assembly
      N90:
        range: integer
        minimum_value: 0
      gcContent:
        range: float
        minimum_value: 0
        maximum_value: 100
  AssemblySoftware:
    attributes:
      name:
        required: true
      uri:
        range: uri
      version: {}
      commandLineOption:
        multivalued: true
  MIGSProjection:
    description: Partial MIxS/MIGS projection; not a complete checklist record.
    attributes:
      number_contig:
        range: integer
        slot_uri: MIXS:0000060
      assembly_software:
        range: string
        slot_uri: MIXS:0000058
      sop:
        range: uri
        slot_uri: MIXS:0000090
        multivalued: true
