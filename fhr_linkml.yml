id: https://w3id.org/fhr
name: FHRLinkMLMapping
description: FHR metadata and partial MIxS/MIGS crosswalks.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
  MIXS: https://w3id.org/mixs/
default_prefix: ex
default_range: string
imports:
- linkml:types
types:
  sha2:
    base: str
    pattern: ^[A-Za-z0-9/+=]{44}$
classes:
  FHR:
    description: Metadata for reference genome assemblies.
    tree_root: true
    attributes:
      schema:
        description: Centralized schema file
        required: true
      schemaVersion:
        description: Version of FHR
        range: float
        required: true
      genome:
        description: Name of the genome
        required: true
      genomeSynonym:
        description: Other common names of the genome
        multivalued: true
      taxon:
        description: Species name and URL of the species information at identifiers.org
        range: Taxon
        inlined: true
        required: true
      version:
        description: Version number of the genome
        required: true
      metadataAuthor:
        description: Authors of the FHR instance
        range: Author
        multivalued: true
        inlined_as_list: true
        required: true
      assemblyAuthor:
        description: Assemblers of the genome
        range: Author
        multivalued: true
        inlined_as_list: true
        required: true
      dateCreated:
        description: Date the genome assembly was created
        range: date
        required: true
      voucherSpecimen:
        description: Description of the physical sample
      accessionID:
        description: Genome assembly accession
        range: AccessionID
        inlined: true
      instrument:
        description: Physical tools and instruments used in the creation of the genome
          assembly
        multivalued: true
      scholarlyArticle:
        description: Scholarly article where the genome was published
        pattern: ^10.
      documentation:
        description: Documentation about the genome
      identifier:
        description: Identifiers of the genome
        multivalued: true
        pattern: '[a-z0-9]*:.*'
      relatedLink:
        description: Related URLs to the genome
        range: uri
        multivalued: true
      funding:
        description: Grant line item
      masking:
        description: Masking applied to the genome assembly
        pattern: (not-masked|hard-masked|soft-masked|repeat-masked|unknown)
        required: true
      vitalStats:
        description: General statistics about the genome assembly
        range: VitalStats
        inlined: true
      checksum:
        description: sha2-512/256 checksum value for hashing
        range: sha2
        required: true
      reuseConditions:
        description: Reuse conditions or license for the genome
      assemblyProtocol:
        broad_mappings:
        - MIXS:0000090
        range: uri
        description: Assembly protocol or workflow reference URI.
      seqcol_id:
        range: string
        pattern: ^[A-Za-z0-9_-]{32}$
        description: Unprefixed refget sequence collection top-level digest (sha512t24u).
      assemblySoftware:
        related_mappings:
        - MIXS:0000058
        description: Assembly software provenance or a legacy name.
        any_of:
        - range: string
        - range: AssemblySoftware
          multivalued: true
          inlined_as_list: true
  Taxon:
    description: Species name and taxonomy URI
    attributes:
      name:
        description: Name of the species
      uri:
        description: Taxonomy URI
        range: uri
        pattern: https://identifiers.org/taxonomy:[0-9]+
  Author:
    description: Person or organization that authored or assembled the genome
    attributes:
      name:
        description: Name of the person or organization
      uri:
        description: ORCID URI
        range: uri
        pattern: ^https://orcid.org/[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9X]
  AccessionID:
    description: Genome assembly accession identifier
    attributes:
      name:
        description: Accession name
      url:
        description: Accession URL
        range: uri
  VitalStats:
    description: General statistics about the genome assembly
    attributes:
      L50:
        description: L50 of the genome assembly
        range: integer
      N50:
        description: N50 of the genome assembly
        range: integer
      L90:
        description: L90 of the genome assembly
        range: integer
      totalBasePairs:
        description: Total base pairs of the genome assembly
        range: integer
      numberContigs:
        exact_mappings:
        - MIXS:0000060
        description: Number of contigs of the genome assembly
        range: integer
      numberScaffolds:
        description: Number of scaffolds of the genome assembly
        range: integer
      readTechnology:
        description: Read technology of the genome assembly
      N90:
        range: integer
        minimum_value: 0
      gcContent:
        range: float
        minimum_value: 0
        maximum_value: 100
  AssemblySoftware:
    attributes:
      name:
        required: true
      uri:
        range: uri
      version: {}
      commandLineOption:
        multivalued: true
  MIGSProjection:
    description: Partial MIxS/MIGS projection; not a complete checklist record.
    attributes:
      number_contig:
        range: integer
        slot_uri: MIXS:0000060
      assembly_software:
        range: string
        slot_uri: MIXS:0000058
      sop:
        range: uri
        slot_uri: MIXS:0000090
